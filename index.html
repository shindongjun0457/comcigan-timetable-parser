<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>오현중학교 시간표</title>
  <style>
    :root {
      --page-pad: clamp(10px, 1.4vh, 20px);
      --bg: #f5f7fb;
      --page-start: #f8fafc;
      --panel: #ffffff;
      --soft: #f8fafc;
      --soft-2: #f9fafb;
      --ink: #111827;
      --ink-subtle: #374151;
      --muted: #6b7280;
      --line: #e5e7eb;
      --blue: #2563eb;
      --blue-ink: #1d4ed8;
      --blue-soft: #eff6ff;
      --changed: #eff6ff;
      --changed-line: #38bdf8;
      --green-soft: #ecfdf5;
      --green-ink: #047857;
      --amber-soft: #fffbeb;
      --amber-ink: #92400e;
      --empty: #d1d5db;
      --placeholder: #9ca3af;
      --danger-bg: #fef2f2;
      --danger-line: #fecaca;
      --danger-ink: #991b1b;
      --dash-line: rgba(209, 213, 219, 0.8);
      --shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0f172a;
        --page-start: #111827;
        --panel: #182235;
        --soft: #111827;
        --soft-2: #151f31;
        --ink: #f8fafc;
        --ink-subtle: #dbeafe;
        --muted: #a8b3c7;
        --line: #314159;
        --blue: #38bdf8;
        --blue-ink: #bae6fd;
        --blue-soft: rgba(56, 189, 248, 0.14);
        --changed: rgba(14, 165, 233, 0.16);
        --changed-line: #7dd3fc;
        --green-soft: rgba(16, 185, 129, 0.14);
        --green-ink: #a7f3d0;
        --amber-soft: rgba(245, 158, 11, 0.13);
        --amber-ink: #fde68a;
        --empty: #64748b;
        --placeholder: #94a3b8;
        --danger-bg: rgba(127, 29, 29, 0.26);
        --danger-line: rgba(248, 113, 113, 0.45);
        --danger-ink: #fecaca;
        --dash-line: rgba(148, 163, 184, 0.35);
        --shadow: 0 18px 45px rgba(0, 0, 0, 0.28);
      }
    }

    :root[data-theme="dark"] {
      --bg: #0f172a;
      --page-start: #111827;
      --panel: #182235;
      --soft: #111827;
      --soft-2: #151f31;
      --ink: #f8fafc;
      --ink-subtle: #dbeafe;
      --muted: #a8b3c7;
      --line: #314159;
      --blue: #38bdf8;
      --blue-ink: #bae6fd;
      --blue-soft: rgba(56, 189, 248, 0.14);
      --changed: rgba(14, 165, 233, 0.16);
      --changed-line: #7dd3fc;
      --green-soft: rgba(16, 185, 129, 0.14);
      --green-ink: #a7f3d0;
      --amber-soft: rgba(245, 158, 11, 0.13);
      --amber-ink: #fde68a;
      --empty: #64748b;
      --placeholder: #94a3b8;
      --danger-bg: rgba(127, 29, 29, 0.26);
      --danger-line: rgba(248, 113, 113, 0.45);
      --danger-ink: #fecaca;
      --dash-line: rgba(148, 163, 184, 0.35);
      --shadow: 0 18px 45px rgba(0, 0, 0, 0.28);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, 0.12), transparent 30%),
        linear-gradient(180deg, var(--page-start) 0%, var(--bg) 100%);
    }

    body {
      padding: var(--page-pad);
      height: 100dvh;
      overflow: hidden;
    }

    .app {
      width: min(100%, 1540px);
      height: calc(100dvh - (var(--page-pad) * 2));
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      min-height: 0;
      transform: translate3d(0, 0, 0);
      transition: transform 1.2s ease;
      will-change: transform;
    }

    .top {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 620px;
      align-items: center;
      gap: 16px;
      margin-bottom: clamp(8px, 1.2vh, 16px);
    }

    .title-block {
      min-width: 0;
      width: 100%;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: clamp(18px, 3vw, 34px);
    }

    .title-block h1 {
      margin: 0;
      font-size: clamp(1.55rem, 2.5vw, 2.25rem);
      letter-spacing: -0.04em;
      line-height: 1.15;
      white-space: nowrap;
    }

    .header-clock {
      height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 2px;
      font-size: clamp(1.65rem, 2.05vw, 2.18rem);
      font-weight: 850;
      letter-spacing: -0.055em;
      line-height: 1;
      font-family: "Pretendard", "Inter", "Segoe UI", system-ui, sans-serif;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1, "ss01" 1;
      color: var(--ink);
      white-space: nowrap;
      min-width: 158px;
      text-align: right;
    }

    .controls {
      justify-self: stretch;
      width: 100%;
      display: grid;
      grid-template-columns: 170px minmax(210px, 1fr) 44px 92px;
      align-items: center;
      justify-content: stretch;
      gap: 8px;
      min-width: 0;
    }

    select, button, input[type="date"], textarea {
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--panel);
      font: inherit;
      color: var(--ink);
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04);
    }

    select, button, input[type="date"] {
      height: 40px;
      padding: 0 12px;
      font-weight: 800;
    }

    input[type="date"] {
      width: 100%;
      min-width: 0;
      padding-left: 12px;
      padding-right: 8px;
    }

    #reloadBtn {
      width: 100%;
      min-width: 0;
      white-space: nowrap;
      padding-left: 10px;
      padding-right: 10px;
    }


    #themeBtn {
      width: 100%;
      min-width: 0;
      padding: 0;
      border-radius: 12px;
      font-size: 1.1rem;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    button {
      cursor: pointer;
      background: var(--blue);
      color: white;
      border-color: var(--blue);
    }

    button.secondary {
      background: var(--panel);
      color: var(--ink);
      border-color: var(--line);
    }

    .grade-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel);
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04);
      width: 100%;
      min-width: 0;
      white-space: nowrap;
    }

    .grade-btn {
      height: 32px;
      padding: 0 8px;
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      border: 0;
      box-shadow: none;
      font-size: 0.88rem;
    }

    .grade-btn.active {
      background: var(--blue);
      color: white;
    }

    button.ghost {
      background: var(--soft);
      color: var(--muted);
      border-color: var(--line);
    }

    button:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    .status-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 13px 15px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      box-shadow: var(--shadow);
    }

    .date-line {
      display: flex;
      align-items: baseline;
      gap: 18px;
      flex-wrap: wrap;
    }

    .date-main {
      font-size: 1.04rem;
      font-weight: 900;
      letter-spacing: -0.03em;
    }

    .clock-main {
      font-size: clamp(1.55rem, 2.5vw, 2.25rem);
      font-weight: 950;
      letter-spacing: -0.04em;
      line-height: 1.05;
      font-variant-numeric: tabular-nums;
    }

    .date-sub {
      margin-top: 3px;
      color: var(--muted);
      font-size: 0.86rem;
    }

    .badge {
      white-space: nowrap;
      border-radius: 999px;
      background: var(--blue-soft);
      color: var(--blue-ink);
      padding: 8px 11px;
      font-weight: 900;
      font-size: 0.84rem;
    }

    .main-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 620px;
      gap: 16px;
      align-items: stretch;
      flex: 1 1 auto;
      min-height: 0;
    }

    .left-panel, .side-panel {
      min-width: 0;
    }

    .left-panel {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .table-wrap, .side-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .table-wrap {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .table-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: clamp(8px, 1.1vh, 14px) 16px;
      border-bottom: 1px solid var(--line);
      background: var(--soft);
    }

    .table-head h2 {
      margin: 0;
      font-size: 1.12rem;
      letter-spacing: -0.04em;
    }

    #refreshInfo {
      color: var(--muted);
      font-size: 0.86rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .table-scroll {
      width: 100%;
      overflow-x: auto;
      flex: 1 1 auto;
      display: flex;
      min-height: 0;
    }

    table {
      width: 100%;
      min-width: 650px;
      border-collapse: separate;
      border-spacing: 0;
      table-layout: fixed;
      height: 100%;
    }

    thead th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: var(--soft);
      border-bottom: 1px solid var(--line);
      height: clamp(38px, 5.4vh, 50px);
      font-size: clamp(1rem, 1.85vh, 1.18rem);
      font-weight: 900;
    }

    tbody th {
      width: 82px;
      background: var(--soft-2);
      color: var(--ink-subtle);
      font-weight: 900;
      border-right: 1px solid var(--line);
    }

    th, td {
      text-align: center;
      border-bottom: 1px solid var(--line);
      border-right: 1px solid var(--line);
      padding: 0;
    }

    th:last-child, td:last-child { border-right: 0; }
    tr:last-child th, tr:last-child td { border-bottom: 0; }

    td {
      height: auto;
      background: var(--panel);
    }

    td.changed {
      background: var(--changed);
      box-shadow: inset 0 0 0 2px var(--changed-line);
    }

    .cell {
      min-height: 0;
      height: 100%;
      padding: clamp(3px, 0.7vh, 8px) 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.08rem, min(1.9vw, 2.65vh), 1.78rem);
      font-weight: 900;
      letter-spacing: -0.04em;
      word-break: keep-all;
      line-height: 1.12;
    }

    .class-head { background: var(--soft); }
    .period { font-size: clamp(1rem, 1.85vh, 1.16rem); }

    .empty {
      color: var(--empty);
      font-weight: 700;
    }

    .side-panel {
      display: grid;
      grid-template-rows: minmax(0, 0.8fr) minmax(0, 1.2fr);
      gap: clamp(8px, 1.3vh, 14px);
      height: 100%;
      min-height: 0;
    }

    .side-card {
      padding: clamp(10px, 1.4vh, 16px);
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    .side-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .side-title h2 {
      margin: 0;
      font-size: 1.12rem;
      letter-spacing: -0.04em;
    }

    .mini-badge {
      border-radius: 999px;
      background: var(--green-soft);
      color: var(--green-ink);
      padding: 5px 9px;
      font-size: 0.76rem;
      font-weight: 900;
      white-space: nowrap;
    }

    .notice-view {
      flex: 1;
      min-height: 0;
      border-radius: 16px;
      background: var(--soft);
      border: 1px solid var(--line);
      padding: 16px;
      font-size: clamp(1.12rem, 1.32vw, 1.42rem);
      font-weight: 600;
      letter-spacing: -0.04em;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: keep-all;
      overflow: auto;
    }

    .notice-placeholder {
      color: var(--placeholder);
      font-weight: 500;
    }

    textarea {
      width: 100%;
      flex: 1;
      min-height: 0;
      padding: 14px;
      resize: vertical;
      line-height: 1.5;
      font-size: clamp(1.08rem, 1.25vw, 1.34rem);
      font-weight: 600;
      display: none;
    }

    .notice-actions {
      display: grid;
      grid-template-columns: repeat(4, auto);
      gap: 6px;
      margin-left: auto;
      flex: 0 0 auto;
    }

    .notice-actions button {
      height: 32px;
      min-width: 54px;
      padding: 0 10px;
      font-size: 0.78rem;
      border-radius: 999px;
      box-shadow: none;
    }

    .local-note {
      margin-top: 9px;
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.45;
    }

    .meal-menu-card {
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
      border-radius: 16px;
      background: var(--soft);
      border: 1px solid var(--line);
      padding: 14px 16px;
      font-size: var(--meal-font-size, clamp(1.12rem, 1.32vw, 1.42rem));
      font-weight: 600;
      letter-spacing: -0.04em;
      line-height: 1.45;
      word-break: keep-all;
    }

    .meal-line {
      padding: clamp(2px, 0.55vh, 4px) 0 clamp(3px, 0.65vh, 6px);
      border-bottom: 1px dashed var(--dash-line);
    }

    .meal-line:last-child {
      border-bottom: 0;
    }

    .meal-name {
      display: inline;
    }

    .allergen-names {
      display: inline;
      margin-left: 8px;
      color: var(--muted);
      font-size: calc(var(--meal-font-size, 1.25rem) * 0.72);
      font-weight: 500;
      line-height: 1.35;
      letter-spacing: -0.03em;
      white-space: normal;
    }

    .allergen-legend {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed var(--dash-line);
      color: var(--muted);
      font-size: 0.72rem;
      line-height: 1.45;
      font-weight: 700;
    }

    .meal-empty, .loading {
      flex: 1;
      padding: 30px 18px;
      text-align: center;
      color: var(--muted);
      font-weight: 800;
      line-height: 1.55;
    }

    .meal-meta {
      margin-top: 10px;
      color: var(--muted);
      font-size: clamp(0.68rem, 1.2vh, 0.82rem);
      line-height: 1.45;
    }

    .error {
      margin-top: 14px;
      background: var(--danger-bg);
      border: 1px solid var(--danger-line);
      color: var(--danger-ink);
      border-radius: 16px;
      padding: 14px 16px;
      line-height: 1.6;
      font-size: 0.95rem;
      display: none;
      white-space: pre-wrap;
    }

    .notice {
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.55;
    }

    footer {
      text-align: center;
      color: var(--muted);
      margin-top: clamp(6px, 1vh, 12px);
      font-size: clamp(0.68rem, 1.2vh, 0.82rem);
    }

    footer a {
      color: inherit;
      text-decoration: none;
      font-weight: 800;
    }

    @media (max-width: 1280px) {
      .top, .main-grid { grid-template-columns: 1fr; }
      .title-block { justify-content: space-between; }
      .controls {
        justify-self: stretch;
        grid-template-columns: 170px minmax(210px, 1fr) 44px 92px;
      }
      .side-panel {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-rows: auto;
      }
    }

    @media (max-width: 760px) {
      body { padding: var(--page-pad); overflow: auto; height: auto; }
      .app { height: auto; min-height: calc(100dvh - (var(--page-pad) * 2)); }
      .top {
        align-items: stretch;
      }
      .title-block {
        align-items: flex-start;
        flex-direction: column;
        gap: 6px;
      }
      .controls {
        grid-template-columns: 1fr 1fr;
      }
      select, button, input[type="date"] { min-width: 0; }
      .header-clock { min-width: 0; }
      .grade-tabs { width: 100%; }
      #reloadBtn { width: 100%; }
      #refreshInfo { white-space: normal; text-align: right; }
      .status-card {
        align-items: flex-start;
        flex-direction: column;
      }
      .badge { white-space: normal; }
      .side-panel { grid-template-columns: 1fr; }
      .notice-actions { grid-template-columns: repeat(4, auto); }
    }

    /* 학교·학년 비전 편집 영역 */
    .vision-editor {
      display: none;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      margin-bottom: 10px;
    }

    .vision-editor.active {
      display: grid;
    }

    .vision-editor input {
      min-width: 0;
      height: 40px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      color: var(--ink);
      font: inherit;
      font-weight: 750;
      outline: none;
    }

    .vision-editor input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px var(--blue-soft);
    }

    .vision-editor button {
      height: 40px;
      padding: 0 14px;
      border-radius: 12px;
      font-weight: 900;
      white-space: nowrap;
    }

    /* 10분마다 표시되는 전체 화면 학교 로고 연출 */
    .logo-show-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      overflow: hidden;
      pointer-events: none;
      visibility: hidden;
      opacity: 0;
      background:
        radial-gradient(circle at 50% 45%, rgba(0, 255, 72, 0.23), transparent 22%),
        radial-gradient(circle at 50% 50%, #10283d 0%, #06111f 52%, #010409 100%);
      transition: opacity 650ms ease, visibility 650ms ease;
    }

    .logo-show-overlay.active {
      visibility: visible;
      opacity: 1;
    }

    .logo-show-overlay::before,
    .logo-show-overlay::after {
      content: "";
      position: absolute;
      width: min(74vw, 900px);
      aspect-ratio: 1;
      border: 2px solid rgba(0, 255, 72, 0.28);
      border-radius: 50%;
      opacity: 0;
    }

    .logo-show-overlay.active::before {
      animation: visionRing 3.1s ease-out 0.5s infinite;
    }

    .logo-show-overlay.active::after {
      animation: visionRing 3.1s ease-out 1.55s infinite;
    }

    .logo-show-beam {
      position: absolute;
      inset: -40%;
      background:
        conic-gradient(
          from 0deg,
          transparent 0deg,
          rgba(0, 255, 72, 0.10) 24deg,
          transparent 50deg,
          transparent 180deg,
          rgba(56, 189, 248, 0.08) 220deg,
          transparent 260deg
        );
      opacity: 0;
      transform: rotate(0deg);
    }

    .logo-show-overlay.active .logo-show-beam {
      opacity: 1;
      animation: visionBeam 8s linear infinite;
    }

    .logo-show-content {
      position: relative;
      z-index: 2;
      width: min(88vw, 1050px);
      text-align: center;
      opacity: 0;
      transform: translateY(28px) scale(0.70);
      filter: blur(14px);
    }

    .logo-show-overlay.active .logo-show-content {
      animation: visionContent 9.1s cubic-bezier(.16,.84,.28,1) forwards;
    }

    .logo-show-image {
      display: block;
      width: min(42vw, 450px);
      max-height: 48vh;
      object-fit: contain;
      margin: 0 auto;
      filter:
        drop-shadow(0 0 15px rgba(0, 255, 72, 0.95))
        drop-shadow(0 0 55px rgba(0, 255, 72, 0.45));
    }

    .logo-show-overlay.active .logo-show-image {
      animation: visionLogoPulse 2.0s ease-in-out 1.15s 3;
    }

    .logo-show-school {
      margin-top: clamp(12px, 2vh, 24px);
      color: #ffffff;
      font-size: clamp(1.2rem, 2.1vw, 2rem);
      font-weight: 950;
      letter-spacing: 0.13em;
      text-shadow: 0 0 24px rgba(255, 255, 255, 0.25);
    }

    .logo-show-vision {
      margin: clamp(10px, 1.8vh, 18px) auto 0;
      max-width: 94%;
      color: #baffc9;
      font-size: clamp(1.45rem, 3.25vw, 3.3rem);
      font-weight: 950;
      letter-spacing: -0.045em;
      line-height: 1.2;
      word-break: keep-all;
      text-wrap: balance;
      text-shadow:
        0 0 10px rgba(0, 255, 72, 0.54),
        0 0 34px rgba(0, 255, 72, 0.30);
    }

    .logo-particle {
      position: absolute;
      z-index: 1;
      left: var(--x);
      top: var(--y);
      width: var(--size);
      height: var(--size);
      border-radius: 50%;
      background: #71ff96;
      box-shadow: 0 0 13px rgba(0, 255, 72, 0.95);
      opacity: 0;
    }

    .logo-show-overlay.active .logo-particle {
      animation: visionParticle 5.7s ease-out infinite;
      animation-delay: var(--delay);
    }

    @keyframes visionContent {
      0%   { opacity: 0; transform: translateY(30px) scale(.68); filter: blur(15px); }
      12%  { opacity: 1; transform: translateY(0) scale(1.045); filter: blur(0); }
      23%  { transform: translateY(0) scale(1); }
      82%  { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
      100% { opacity: 0; transform: translateY(-18px) scale(1.09); filter: blur(11px); }
    }

    @keyframes visionLogoPulse {
      0%, 100% {
        transform: scale(1);
        filter:
          drop-shadow(0 0 15px rgba(0, 255, 72, 0.95))
          drop-shadow(0 0 55px rgba(0, 255, 72, 0.45));
      }
      50% {
        transform: scale(1.06);
        filter:
          drop-shadow(0 0 30px rgba(0, 255, 72, 1))
          drop-shadow(0 0 95px rgba(0, 255, 72, 0.68));
      }
    }

    @keyframes visionRing {
      0%   { transform: scale(.22); opacity: .82; }
      100% { transform: scale(1.38); opacity: 0; }
    }

    @keyframes visionBeam {
      to { transform: rotate(360deg); }
    }

    @keyframes visionParticle {
      0%   { opacity: 0; transform: translate3d(0, 40px, 0) scale(.2); }
      14%  { opacity: .95; }
      100% { opacity: 0; transform: translate3d(var(--dx), -190px, 0) scale(1.5); }
    }

    @media (prefers-reduced-motion: reduce) {
      .logo-show-overlay *,
      .logo-show-overlay::before,
      .logo-show-overlay::after {
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
      }
    }

  </style>
</head>
<body>
  <main class="app">
    <header class="top">
      <div class="title-block">
        <h1>오현중학교 시간표</h1>

      </div>

      <div class="controls">
        <input id="dateInput" type="date" aria-label="날짜 선택" />
        <div class="grade-tabs" role="group" aria-label="학년 선택">
          <button class="grade-btn" type="button" data-grade="1">1학년</button>

          <button class="grade-btn" type="button" data-grade="3">3학년</button>
        </div>
        <button id="themeBtn" class="secondary" type="button" aria-label="화면 모드 전환" title="화면 모드 전환">🌙</button>

<script>
const CLASSES_PER_GRADE = 7;
const PERIODS = 7;
const WEEKDAY_KO = ["일", "월", "화", "수", "목", "금", "토"];
const ALLERGEN_MAP = {
  "1": "난류",
  "2": "우유",
  "3": "메밀",
  "4": "땅콩",
  "5": "대두",
  "6": "밀",
  "7": "고등어",
  "8": "게",
  "9": "새우",
  "10": "돼지고기",
  "11": "복숭아",
  "12": "토마토",
  "13": "아황산류",
  "14": "호두",
  "15": "닭고기",
  "16": "쇠고기",
  "17": "오징어",
  "18": "조개류",
  "19": "잣"
};

const state = {
  grade: 1,
  date: "",
  data: null,
  updatedAt: null,
  noticeEditing: false,
  noticeText: "",
  noticeLoading: false,
  visionEditing: false,
  visionText: "",
  visionScope: "school",
  timetableSignature: ""
};

const $ = (id) => document.getElementById(id);
const THEME_STORAGE_KEY = "comci-dashboard-theme";
const DEFAULT_THEME = "dark";

// 화면 보호 및 학교 비전 로고 연출 설정
const SCREEN_SHIFT_INTERVAL_MS = 5 * 60 * 1000;   // 5분마다 미세 이동
const SCREEN_SHIFT_MAX_PX = 3;                     // 최대 ±3px
const LOGO_SHOW_INTERVAL_MS = 10 * 60 * 1000;     // 10분마다 로고 연출
const LOGO_SHOW_DURATION_MS = 10 * 1000;           // 약 10초간 표시

let logoShowTimer = null;
let logoHideTimer = null;
let logoShowing = false;

function getDefaultGradeFromHost() {
  const host = window.location.hostname.toLowerCase();

  if (host === "tt1.djcom.kr" || host.startsWith("tt1.")) return 1;
  if (host === "tt2.djcom.kr" || host.startsWith("tt2.")) return 2;
  if (host === "tt3.djcom.kr" || host.startsWith("tt3.")) return 3;

  return 1;
}

function getStoredTheme() {
  const value = localStorage.getItem(THEME_STORAGE_KEY);
  return value === "light" || value === "dark" ? value : DEFAULT_THEME;
}

function getEffectiveTheme() {
  return getStoredTheme();
}

function applyTheme(theme = getEffectiveTheme()) {
  document.documentElement.setAttribute("data-theme", theme);

  const button = $("themeBtn");
  if (button) {
    button.textContent = theme === "dark" ? "☀️" : "🌙";
    button.title = `${theme === "dark" ? "다크" : "라이트"} 모드 사용 중. 클릭하면 전환됩니다.`;
    button.setAttribute("aria-label", button.title);
  }
}

function toggleThemeOverride() {
  const next = getEffectiveTheme() === "dark" ? "light" : "dark";
  localStorage.setItem(THEME_STORAGE_KEY, next);
  applyTheme(next);
}

function moveScreenSlightly() {
  const app = document.querySelector(".app");
  if (!app) return;

  const randomOffset = () =>
    Math.floor(Math.random() * (SCREEN_SHIFT_MAX_PX * 2 + 1)) - SCREEN_SHIFT_MAX_PX;

  const x = randomOffset();
  const y = randomOffset();
  app.style.transform = `translate3d(${x}px, ${y}px, 0)`;
}

function startScreenShift() {
  moveScreenSlightly();
  setInterval(moveScreenSlightly, SCREEN_SHIFT_INTERVAL_MS);
}


function getVisionScopeFromHost() {
  const host = window.location.hostname.toLowerCase();

  if (host === "tt1.djcom.kr" || host.startsWith("tt1.")) return "1";
  if (host === "tt2.djcom.kr" || host.startsWith("tt2.")) return "2";
  if (host === "tt3.djcom.kr" || host.startsWith("tt3.")) return "3";

  return "school";
}

function getVisionLabel(scope = state.visionScope) {
  return scope === "school" ? "학교 비전" : `${scope}학년 비전`;
}

function getVisionFallback(scope = state.visionScope) {
  if (scope === "1") return "우리는 가능성 덩어리";
  if (scope === "2") return "함께 배우고 함께 성장하는 2학년";
  if (scope === "3") return "스스로 선택하고 책임지는 3학년";
  return "배움으로 성장하는 오현중학교";
}

function renderVisionEditor() {
  const editor = $("visionEditor");
  const button = $("visionEditBtn");
  const input = $("visionInput");

  if (!editor || !button || !input) return;

  editor.classList.toggle("active", state.visionEditing);
  button.textContent = state.visionEditing ? "닫기" : getVisionLabel();
  input.placeholder = `${getVisionLabel()}을 입력하세요.`;
  input.value = state.visionText || "";

  if (state.visionEditing) {
    setTimeout(() => input.focus(), 0);
  }
}

function updateLogoShowText() {
  const schoolText =
    state.visionScope === "school"
      ? "오현중학교"
      : `오현중학교 ${state.visionScope}학년`;

  $("logoShowSchool").textContent = schoolText;
  $("logoShowVision").textContent =
    state.visionText || getVisionFallback(state.visionScope);
}

function showLogoPresentation() {
  if (logoShowing || document.hidden) return;

  logoShowing = true;
  updateLogoShowText();

  const overlay = $("logoShowOverlay");
  overlay.classList.remove("active");

  // 같은 애니메이션을 매번 처음부터 다시 실행
  void overlay.offsetWidth;

  overlay.classList.add("active");
  overlay.setAttribute("aria-hidden", "false");

  clearTimeout(logoHideTimer);
  logoHideTimer = setTimeout(hideLogoPresentation, LOGO_SHOW_DURATION_MS);
}

function hideLogoPresentation() {
  const overlay = $("logoShowOverlay");
  overlay.classList.remove("active");
  overlay.setAttribute("aria-hidden", "true");
  logoShowing = false;
}

function startLogoPresentationCycle() {
  clearInterval(logoShowTimer);
  logoShowTimer = setInterval(showLogoPresentation, LOGO_SHOW_INTERVAL_MS);
}

function getKstDate() {
  const now = new Date();
  const utc = now.getTime() + now.getTimezoneOffset() * 60000;
  return new Date(utc + 9 * 60 * 60 * 1000);
}

function toDateInputValue(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

function dateFromInput(value) {
  return new Date(`${value}T00:00:00+09:00`);
}

function formatDateKST(value) {
  const date = typeof value === "string" ? dateFromInput(value) : value;
  const y = date.getFullYear();
  const m = date.getMonth() + 1;
  const d = date.getDate();
  const w = WEEKDAY_KO[date.getDay()];
  return `${y}년 ${m}월 ${d}일 (${w})`;
}

function formatTableTitleDate(value) {
  const date = typeof value === "string" ? dateFromInput(value) : value;
  const m = date.getMonth() + 1;
  const d = date.getDate();
  const w = WEEKDAY_KO[date.getDay()];
  return `${m}월 ${d}일(${w})`;
}

function addDays(date, days) {
  const copy = new Date(date);
  copy.setDate(copy.getDate() + days);
  return copy;
}

function setStatus(main, sub, badge) {
  // 상단 상태 카드는 제거했습니다. 로딩/오류 상태는 표와 오류 박스에서만 표시합니다.
}

function updateClock() {
  const now = getKstDate();
  const hh = String(now.getHours()).padStart(2, "0");
  const mm = String(now.getMinutes()).padStart(2, "0");
  const ss = String(now.getSeconds()).padStart(2, "0");
  $("clockText").textContent = `${hh}:${mm}:${ss}`;
}

function showError(message) {
  const box = $("errorBox");
  box.style.display = "block";
  box.textContent = message;
}

function clearError() {
  const box = $("errorBox");
  box.style.display = "none";
  box.textContent = "";
}

function setLoading(message = "컴시간알리미 서버에서 시간표를 불러오고 있습니다.") {
  $("timetable").innerHTML = `<tbody><tr><td class="loading">${escapeHtml(message)}</td></tr></tbody>`;
}

async function fetchTimetable(dateValue) {
  const res = await fetch(`/api/timetable?date=${encodeURIComponent(dateValue)}`, { cache: "no-store" });
  const text = await res.text();

  if (!res.ok) throw new Error(`API 오류 ${res.status}\n${text.slice(0, 600)}`);

  try {
    return JSON.parse(text);
  } catch (err) {
    throw new Error("API 응답을 JSON으로 해석하지 못했습니다.\n" + text.slice(0, 600));
  }
}

async function fetchMeal(dateValue) {
  const res = await fetch(`/api/meal?date=${encodeURIComponent(dateValue)}`, { cache: "no-store" });
  const text = await res.text();

  if (!res.ok) throw new Error(`급식 API 오류 ${res.status}\n${text.slice(0, 600)}`);

  try {
    return JSON.parse(text);
  } catch (err) {
    throw new Error("급식 API 응답을 JSON으로 해석하지 못했습니다.\n" + text.slice(0, 600));
  }
}

function makeTimetableSignature(data) {
  return JSON.stringify({
    자료147: data?.["자료147"] || null,
    자료481: data?.["자료481"] || null,
    자료492: data?.["자료492"] || null,
    자료446: data?.["자료446"] || null,
    자료244: data?.["자료244"] || null
  });
}

function decodeLessonCode(value, data) {
  if (value === undefined || value === null || value === 0 || value === "0") {
    return { subject: "", teacher: "", changed: false, raw: value };
  }

  const raw = String(value);
  const changed = raw.startsWith(">");
  const numeric = Number(raw.replace(">", ""));

  if (!numeric) return { subject: "", teacher: "", changed, raw: value };

  const subjectIndex = Math.floor(numeric / 1000);
  const teacherIndex = numeric % 1000;

  return {
    subject: data["자료492"]?.[subjectIndex] || "",
    teacher: data["자료446"]?.[teacherIndex] || "",
    changed,
    raw: value
  };
}

function getDayArray(data, grade, classNo, dayIndex) {
  const changedDay = data?.["자료147"]?.[grade]?.[classNo]?.[dayIndex];
  const baseDay = data?.["자료481"]?.[grade]?.[classNo]?.[dayIndex];

  if (Array.isArray(changedDay) && changedDay.length > 1 && changedDay.slice(1).some((v) => v !== 0 && v !== "0")) {
    return changedDay;
  }

  return baseDay;
}

function render() {
  const grade = Number(state.grade);
  const date = dateFromInput(state.date);
  const dayIndex = date.getDay();

  updateGradeButtons();
  $("dateInput").value = state.date;
  $("tableTitle").textContent = `${formatTableTitleDate(state.date)} ${grade}학년 시간표`;

  if (!state.data) return;

  const updated = state.updatedAt
    ? state.updatedAt.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" })
    : "";

  $("refreshInfo").textContent = updated ? `마지막 새로고침: ${updated}` : "마지막 새로고침: -";

  if (dayIndex === 0 || dayIndex === 6) {
    setStatus(formatDateKST(state.date), "주말입니다. 해당 날짜 데이터가 없으면 빈칸으로 표시됩니다.", `${grade}학년`);
  } else {
    setStatus(formatDateKST(state.date), "", `${grade}학년`);
  }

  let thead = `
    <thead>
      <tr>
        <th class="period class-head">교시</th>
        ${Array.from({ length: CLASSES_PER_GRADE }, (_, i) => `<th class="class-head">${i + 1}반</th>`).join("")}
      </tr>
    </thead>
  `;

  let tbody = "<tbody>";

  for (let period = 1; period <= PERIODS; period++) {
    tbody += `<tr><th class="period">${period}교시</th>`;

    for (let classNo = 1; classNo <= CLASSES_PER_GRADE; classNo++) {
      const dayArray = getDayArray(state.data, grade, classNo, dayIndex);
      const lesson = decodeLessonCode(dayArray?.[period], state.data);
      const subject = lesson.subject || "";

      tbody += `
        <td class="${lesson.changed ? "changed" : ""}" title="${escapeHtml(lesson.teacher || "")}">
          <div class="cell ${subject ? "" : "empty"}">${escapeHtml(subject || "-")}</div>
        </td>
      `;
    }

    tbody += "</tr>";
  }

  tbody += "</tbody>";
  $("timetable").innerHTML = thead + tbody;
}

function renderMealLoading() {
  $("mealBadge").textContent = "불러오는 중";
  $("mealBox").className = "meal-empty";
  $("mealBox").textContent = "급식 정보를 불러오는 중입니다.";
  $("mealMeta").textContent = "";
}

function renderMeal(data) {
  if (!data?.ok || !Array.isArray(data.menu) || data.menu.length === 0) {
    $("mealBadge").textContent = "정보 없음";
    $("mealBox").className = "meal-empty";
    $("mealBox").textContent = data?.message || "해당 날짜의 급식 정보가 없습니다.";
    $("mealMeta").textContent = "";
    return;
  }

  $("mealBadge").textContent = data.mealName || "중식";
  $("mealBox").className = "meal-menu-card";
  $("mealBox").innerHTML = data.menu.map((item) => {
    const name = typeof item === "string" ? item : item.name;
    const allergens = Array.isArray(item?.allergens) ? item.allergens : [];
    const allergenNames = allergens
      .map((code) => ALLERGEN_MAP[String(code)] || String(code))
      .filter(Boolean)
      .join(" · ");

    return `
      <div class="meal-line">
        <span class="meal-name">${escapeHtml(name)}</span>
        ${allergenNames ? `<span class="allergen-names">(${escapeHtml(allergenNames)})</span>` : ""}
      </div>
    `;
  }).join("");
  $("mealMeta").textContent = data.calories ? `열량: ${data.calories}` : "";
  requestAnimationFrame(fitMealTextToCard);
}

function fitMealTextToCard() {
  const box = $("mealBox");
  if (!box || !box.classList.contains("meal-menu-card")) return;

  const maxFont = 22;
  const minFont = 13;

  box.style.setProperty("--meal-font-size", `${maxFont}px`);

  let size = maxFont;
  while (size > minFont && box.scrollHeight > box.clientHeight) {
    size -= 0.5;
    box.style.setProperty("--meal-font-size", `${size}px`);
  }
}

window.addEventListener("resize", () => {
  requestAnimationFrame(fitMealTextToCard);
});

async function loadMeal() {
  renderMealLoading();
  try {
    const meal = await fetchMeal(state.date);
    renderMeal(meal);
  } catch (err) {
    console.error(err);
    $("mealBadge").textContent = "오류";
    $("mealBox").className = "meal-empty";
    $("mealBox").textContent = "급식 정보를 불러오지 못했습니다.";
    $("mealMeta").textContent = err?.message || String(err);
  }
}

async function refreshTimetableOnly({ force = false, showLoading = false } = {}) {
  clearError();
  if (showLoading) setLoading();

  const timetable = await fetchTimetable(state.date);
  const nextSignature = makeTimetableSignature(timetable);
  const changed = force || !state.timetableSignature || nextSignature !== state.timetableSignature;

  if (changed) {
    state.data = timetable;
    state.timetableSignature = nextSignature;
    state.updatedAt = new Date();
    render();
  }

  return changed;
}

async function loadTimetable({ includeMeal = true, force = true, showLoading = true } = {}) {
  clearError();
  if (showLoading) setLoading();
  $("reloadBtn").disabled = true;

  try {
    setStatus(formatDateKST(state.date), "내 사이트 API를 통해 컴시간 서버에 연결 중입니다.", "연결 중");

    if (includeMeal) {
      await Promise.all([
        refreshTimetableOnly({ force, showLoading: false }),
        loadMeal()
      ]);
    } else {
      await refreshTimetableOnly({ force, showLoading: false });
    }
  } catch (err) {
    console.error(err);
    showError("시간표를 불러오지 못했습니다.\n" + (err?.message || err));
    setStatus(formatDateKST(state.date), "시간표 로딩 실패", "오류");
  } finally {
    $("reloadBtn").disabled = false;
  }
}

async function refreshAllManually() {
  clearError();
  await Promise.all([
    loadTimetable({ includeMeal: true, force: true, showLoading: true }),
    loadNotice()
  ]);
}

async function checkDateHourly() {
  const today = toDateInputValue(getKstDate());
  if (today !== state.date) {
    state.date = today;
    $("dateInput").value = today;
    await loadTimetable({ includeMeal: true, force: true, showLoading: false });
  }
}

async function checkTimetableEveryFiveMinutes() {
  try {
    await loadTimetable({ includeMeal: false, force: false, showLoading: false });
  } catch (error) {
    console.error(error);
  }
}

async function fetchNotice(grade) {
  const res = await fetch(`/api/notice?grade=${encodeURIComponent(grade)}`, { cache: "no-store" });
  const text = await res.text();
  if (!res.ok) throw new Error(`공지사항 API 오류 ${res.status}\n${text.slice(0, 400)}`);
  return JSON.parse(text);
}

async function loadNotice() {
  state.noticeLoading = true;
  renderNotice();

  try {
    const data = await fetchNotice(state.grade);
    state.noticeText = data?.content || "";

    state.visionText =
      state.visionScope === "school"
        ? (data?.schoolVision || "")
        : (data?.vision || "");

    renderVisionEditor();
    updateLogoShowText();
  } catch (error) {
    console.error(error);
    state.noticeText = "";
    showError("공지사항을 불러오지 못했습니다.\n" + (error?.message || error));
  } finally {
    state.noticeLoading = false;
    renderNotice();
  }
}

async function saveNotice(value) {
  const res = await fetch(`/api/notice?grade=${encodeURIComponent(state.grade)}`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ content: value })
  });

  const text = await res.text();

  if (!res.ok) throw new Error(`공지사항 저장 오류 ${res.status}\n${text.slice(0, 400)}`);

  const data = JSON.parse(text);
  state.noticeText = data?.content || "";
  return true;
}

async function saveVision(value) {
  const body =
    state.visionScope === "school"
      ? { schoolVision: value }
      : { vision: value };

  const res = await fetch(`/api/notice?grade=${encodeURIComponent(state.grade)}`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(body)
  });

  const text = await res.text();

  if (!res.ok) {
    throw new Error(`비전 저장 오류 ${res.status}\n${text.slice(0, 400)}`);
  }

  const data = JSON.parse(text);

  state.visionText =
    state.visionScope === "school"
      ? (data?.schoolVision || "")
      : (data?.vision || "");

  updateLogoShowText();
  return true;
}

async function clearNotice() {
  return saveNotice("");
}

function renderNotice() {
  const value = state.noticeText || "";
  const view = $("noticeView");
  const input = $("noticeInput");

  if (!state.noticeEditing) input.value = value;

  if (state.noticeEditing) {
    view.style.display = "none";
    input.style.display = "block";
    $("noticeEditBtn").textContent = "보기";
    setTimeout(() => input.focus(), 0);
  } else {
    input.style.display = "none";
    view.style.display = "block";
    $("noticeEditBtn").textContent = "수정";
    view.textContent = state.noticeLoading ? "공지사항을 불러오는 중입니다." : (value || "공지사항을 입력하세요.");
    view.classList.toggle("notice-placeholder", state.noticeLoading || !value);
  }
}

function escapeHtml(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function updateGradeButtons() {
  document.querySelectorAll(".grade-btn").forEach((button) => {
    button.classList.toggle("active", Number(button.dataset.grade) === Number(state.grade));
  });
}

document.querySelectorAll(".grade-btn").forEach((button) => {
  button.addEventListener("click", async () => {
    state.grade = Number(button.dataset.grade);
    state.noticeEditing = false;
    render();
    await loadNotice();
  });
});

$("dateInput").addEventListener("change", async (e) => {
  state.date = e.target.value;
  await loadTimetable({ includeMeal: true, force: true, showLoading: true });
});

$("themeBtn").addEventListener("click", toggleThemeOverride);


$("reloadBtn").addEventListener("click", refreshAllManually);


$("visionEditBtn").addEventListener("click", () => {
  state.visionEditing = !state.visionEditing;
  renderVisionEditor();
});

$("visionSaveBtn").addEventListener("click", async () => {
  try {
    await saveVision($("visionInput").value.trim());
    state.visionEditing = false;
    renderVisionEditor();

    // 저장 직후 실제 연출을 바로 확인할 수 있도록 미리보기 실행
    showLogoPresentation();
  } catch (error) {
    console.error(error);
    showError("비전을 저장하지 못했습니다.\n" + (error?.message || error));
  }
});

$("visionInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    e.preventDefault();
    $("visionSaveBtn").click();
  }
});

$("noticeEditBtn").addEventListener("click", () => {
  state.noticeEditing = !state.noticeEditing;
  renderNotice();
});

$("noticeSaveBtn").addEventListener("click", async () => {
  try {
    const ok = await saveNotice($("noticeInput").value.trim());
    if (ok) {
      state.noticeEditing = false;
      renderNotice();
    }
  } catch (error) {
    console.error(error);
    showError("공지사항을 저장하지 못했습니다.\n" + (error?.message || error));
  }
});

$("noticeClearBtn").addEventListener("click", async () => {
  try {
    const ok = await clearNotice();
    if (ok) {
      state.noticeEditing = false;
      renderNotice();
    }
  } catch (error) {
    console.error(error);
    showError("공지사항을 비우지 못했습니다.\n" + (error?.message || error));
  }
});

$("noticeInput").addEventListener("keydown", async (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
    try {
      const ok = await saveNotice($("noticeInput").value.trim());
      if (ok) {
        state.noticeEditing = false;
        renderNotice();
      }
    } catch (error) {
      console.error(error);
      showError("공지사항을 저장하지 못했습니다.\n" + (error?.message || error));
    }
  }
});

(async function init() {
  applyTheme();
  startScreenShift();
  startLogoPresentationCycle();

  state.visionScope = getVisionScopeFromHost();
  state.grade = getDefaultGradeFromHost();
  state.date = toDateInputValue(getKstDate());
  updateGradeButtons();
  $("dateInput").value = state.date;
  setStatus(formatDateKST(state.date), "시간표를 준비 중입니다.", "준비 중");
  renderNotice();
  renderVisionEditor();
  updateLogoShowText();
  await loadNotice();
  updateClock();
  setInterval(updateClock, 1000);
  setInterval(checkDateHourly, 60 * 60 * 1000);
  setInterval(checkTimetableEveryFiveMinutes, 5 * 60 * 1000);
  await loadTimetable({ includeMeal: true, force: true, showLoading: true });
})();
</script>
</body>
</html>
